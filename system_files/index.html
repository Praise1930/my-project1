<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- Zoom is deliberately left enabled. Blocking it (maximum-scale=1,
         user-scalable=no) fails WCAG 1.4.4, and this is read by mothers and
         village health workers on small screens who may need to enlarge a
         reading or an address. viewport-fit=cover lets the layout use the full
         screen on notched devices; safe-area insets keep content clear of them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>MamaTrack GPS — Mukono Maternal Emergency Response System</title>
    <meta name="description" content="GPS-based maternal emergency response system for Mukono District, Uganda. Connecting expectant mothers, ambulance dispatchers, and clinical care facilities." />
    
    <!-- Preconnect and Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter and Outfit are the design tokens; Poppins (doctor portal) and
         Public Sans (admin portal) are set by those screens and used to be
         fetched at runtime after the first paint, or not at all. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&family=Public+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- PWA Settings.
         The icons here and in the manifest must be real PNGs at exactly the
         sizes they declare. They previously were 1024x1024 JPEGs named .png,
         which Chrome rejects — that failed the installability check, so "Add to
         home screen" produced a plain bookmark that opened in the browser with
         its chrome and pinch-zoom instead of installing the app. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="application-name" content="MamaTrack" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <!-- iOS ignores the manifest: it needs its own 180x180 icon and these metas
         to launch full-screen from the home screen. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MamaTrack" />
    
    <script>
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('Service Worker registered successfully:', reg.scope);
              reg.update();
            })
            .catch(err => console.log('Service Worker registration failed:', err));
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
